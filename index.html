<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antriebstechnik Quiz</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --correct-color: #2ecc71;
            --wrong-color: #e74c3c;
            --border-radius: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background: var(--card-bg);
            max-width: 600px;
            width: 100%;
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 15px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
            color: #7f8c8d;
            margin-bottom: 20px;
            background: var(--bg-color);
            padding: 10px 15px;
            border-radius: var(--border-radius);
        }

        .progress-container {
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 8px;
            width: 100%;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            background-color: var(--accent-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .question {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .choice-btn {
            background-color: var(--card-bg);
            border: 2px solid #e2e8f0;
            border-radius: var(--border-radius);
            padding: 14px 20px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            color: var(--text-color);
        }

        .choice-btn:hover:not([disabled]) {
            border-color: var(--accent-color);
            background-color: #f8fafc;
        }

        .choice-btn.correct {
            background-color: #edfdf4 !important;
            border-color: var(--correct-color) !important;
            color: #14532d !important;
            font-weight: 600;
        }

        .choice-btn.wrong {
            background-color: #fdf2f2 !important;
            border-color: var(--wrong-color) !important;
            color: #741b1b !important;
        }

        .nav-actions {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
            display: none;
        }

        .next-btn:hover {
            opacity: 0.9;
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .result-score {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 20px 0;
        }

        .restart-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
        }
        
        .error-message {
            color: var(--wrong-color);
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>Antriebstechnik Quiz</h1>
    
    <div id="quiz-interface">
        <div class="stats-bar">
            <span id="question-counter">Frage: -- / --</span>
            <span id="score-percentage">Richtig: 0%</span>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        
        <div class="question" id="question-text">Lade Fragen aus Fragen.json...</div>
        <div class="choices" id="choices-container"></div>
        
        <div class="nav-actions">
            <button class="next-btn" id="next-button" onclick="nextQuestion()">Nächste Frage</button>
        </div>
    </div>

    <div id="result-screen" class="result-screen">
        <h2>Quiz beendet!</h2>
        <p>Dein Ergebnis:</p>
        <div class="result-score" id="final-score">0 / 0</div>
        <p id="final-percentage">0% richtig beantwortet</p>
        <button class="restart-btn" onclick="restartQuiz()">Quiz neustarten</button>
    </div>
</div>

<script>
    let questions = [];
    let currentQuestionIndex = 0;
    let correctAnswersCount = 0;
    let answeredQuestionsCount = 0;

    // AJAX/Fetch Aufruf zieht die Fragen live aus der Datei im selben Verzeichnis
    async function loadQuestions() {
        try {
            // Holt die Fragen.json relativ vom Server/GitHub Pages Verzeichnis
            const response = await fetch('Fragen.json');
            if (!response.ok) {
                throw new Error(`Fehler beim Laden: Server antwortete mit Status ${response.status}`);
            }
            questions = await response.json();
            
            if (!Array.isArray(questions) || questions.length === 0) {
                throw new Error("Die JSON-Datei ist leer oder hat kein gültiges Array-Format.");
            }
            
            initQuiz();
        } catch (error) {
            console.error("Quiz-Ladefehler:", error);
            document.getElementById('question-text').innerHTML = 
                `<div class="error-message">Mensch, da lief was schief!<br><br>` +
                `Die Datei <strong>Fragen.json</strong> konnte nicht geladen werden.<br>` +
                `<small style="color: #7f8c8d; font-weight: normal;">Hinweis: Lokal im Browser (per Doppelklick auf die index.html) blockieren Browser diesen Ladevorgang aus Sicherheitsgründen (CORS). Sobald es auf GitHub Pages hochgeladen ist, funktioniert es perfekt!</small></div>`;
        }
    }

    function initQuiz() {
        currentQuestionIndex = 0;
        correctAnswersCount = 0;
        answeredQuestionsCount = 0;
        
        document.getElementById('quiz-interface').style.display = 'block';
        document.getElementById('result-screen').style.display = 'none';
        
        updateStats();
        showQuestion();
    }

    function updateStats() {
        document.getElementById('question-counter').innerText = `Frage: ${currentQuestionIndex + 1} / ${questions.length}`;
        
        let percentage = answeredQuestionsCount === 0 ? 0 : Math.round((correctAnswersCount / answeredQuestionsCount) * 100);
        document.getElementById('score-percentage').innerText = `Richtig: ${percentage}%`;
        
        let progressWidth = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById('progress-bar').style.width = `${progressWidth}%`;
    }

    function showQuestion() {
        const currentQuestion = questions[currentQuestionIndex];
        document.getElementById('question-text').innerText = currentQuestion.question;
        
        const choicesContainer = document.getElementById('choices-container');
        choicesContainer.innerHTML = '';
        
        document.getElementById('next-button').style.display = 'none';

        currentQuestion.choices.forEach((choice, index) => {
            const button = document.createElement('button');
            button.classList.add('choice-btn');
            button.innerText = choice;
            button.onclick = () => selectAnswer(index, button);
            choicesContainer.appendChild(button);
        });
        
        updateStats();
    }

    function selectAnswer(selectedIndex, selectedButton) {
        const currentQuestion = questions[currentQuestionIndex];
        const choicesContainer = document.getElementById('choices-container');
        const buttons = choicesContainer.getElementsByClassName('choice-btn');
        
        answeredQuestionsCount++;

        if (selectedIndex === currentQuestion.answer) {
            selectedButton.classList.add('correct');
            correctAnswersCount++;
        } else {
            selectedButton.classList.add('wrong');
            if(buttons[currentQuestion.answer]) {
                buttons[currentQuestion.answer].classList.add('correct');
            }
        }

        for (let button of buttons) {
            button.disabled = true;
        }

        let percentage = Math.round((correctAnswersCount / answeredQuestionsCount) * 100);
        document.getElementById('score-percentage').innerText = `Richtig: ${percentage}%`;

        document.getElementById('next-button').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            showQuestion();
        } else {
            showEndScreen();
        }
    }

    function showEndScreen() {
        document.getElementById('quiz-interface').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        
        document.getElementById('final-score').innerText = `${correctAnswersCount} / ${questions.length}`;
        let finalPercentage = Math.round((correctAnswersCount / questions.length) * 100);
        document.getElementById('final-percentage').innerText = `${finalPercentage}% der Fragen richtig beantwortet.`;
    }

    function restartQuiz() {
        initQuiz();
    }

    window.onload = loadQuestions;
</script>

</body>
</html>
