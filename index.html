<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antriebstechnik Quiz</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --correct-color: #2ecc71;
            --wrong-color: #e74c3c;
            --border-radius: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background: var(--card-bg);
            max-width: 600px;
            width: 100%;
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 15px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: #7f8c8d;
            margin-bottom: 20px;
            background: var(--bg-color);
            padding: 10px 15px;
            border-radius: var(--border-radius);
            gap: 10px;
            flex-wrap: wrap;
        }

        .stats-left {
            display: flex;
            gap: 15px;
        }

        /* Shuffle Toggle Switch Styling */
        .shuffle-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-color);
        }

        input:checked + .slider:before {
            transform: translateX(18px);
        }

        .progress-container {
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 8px;
            width: 100%;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            background-color: var(--accent-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .question {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 5px;
            line-height: 1.4;
        }

        .hint {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-bottom: 20px;
            font-style: italic;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .choice-btn {
            background-color: var(--card-bg);
            border: 2px solid #e2e8f0;
            border-radius: var(--border-radius);
            padding: 14px 20px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .choice-btn:hover:not([disabled]) {
            border-color: var(--accent-color);
            background-color: #f8fafc;
        }

        .choice-btn.selected {
            border-color: var(--accent-color);
            background-color: #ebf5fb;
        }

        .choice-btn.correct-truth {
            background-color: #edfdf4 !important;
            border-color: var(--correct-color) !important;
            color: #14532d !important;
            font-weight: 600;
        }

        .choice-btn.wrong-selected {
            background-color: #fdf2f2 !important;
            border-color: var(--wrong-color) !important;
            color: #741b1b !important;
        }

        .nav-actions {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .action-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        #next-button {
            background-color: #27ae60;
            display: none;
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .result-score {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 20px 0;
        }

        .error-message {
            color: var(--wrong-color);
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>Antriebstechnik Quiz</h1>
    
    <div id="quiz-interface">
        <div class="stats-bar">
            <div class="stats-left">
                <span id="question-counter">Frage: -- / --</span>
                <span id="score-percentage">Richtig: 0%</span>
            </div>
            <label class="shuffle-container">
                <span>🔀 Zufällig</span>
                <span class="switch">
                    <input type="checkbox" id="shuffle-toggle" onchange="handleShuffleToggle()">
                    <span class="slider"></span>
                </span>
            </label>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        
        <div class="question" id="question-text">Lade Fragen aus Fragen.json...</div>
        <div class="hint" id="question-hint"></div>
        <div class="choices" id="choices-container"></div>
        
        <div class="nav-actions">
            <button class="action-btn" id="submit-button" onclick="checkAnswers()">Antwort prüfen</button>
            <button class="action-btn" id="next-button" onclick="nextQuestion()">Nächste Frage</button>
        </div>
    </div>

    <div id="result-screen" class="result-screen">
        <h2>Quiz beendet!</h2>
        <p>Dein Ergebnis:</p>
        <div class="result-score" id="final-score">0 / 0</div>
        <p id="final-percentage">0% richtig beantwortet</p>
        <button class="action-btn" onclick="restartQuiz()">Quiz neustarten</button>
    </div>
</div>

<script>
    let originalQuestions = []; // Unveränderte Original-Liste aus der JSON
    let activeQuestions = [];   // Die aktuell genutzte Liste (evtl. gemischt)
    let currentQuestionIndex = 0;
    let correctAnswersCount = 0;
    let answeredQuestionsCount = 0;
    let selectedIndices = [];
    let isRevealed = false;

    async function loadQuestions() {
        try {
            const response = await fetch('Fragen.json');
            if (!response.ok) {
                throw new Error(`Fehler beim Laden: Server antwortete mit Status ${response.status}`);
            }
            originalQuestions = await response.json();
            
            if (!Array.isArray(originalQuestions) || originalQuestions.length === 0) {
                throw new Error("Die JSON-Datei ist leer oder hat kein gültiges Array-Format.");
            }
            
            initQuiz();
        } catch (error) {
            console.error("Quiz-Ladefehler:", error);
            document.getElementById('question-text').innerHTML = 
                `<div class="error-message">Mensch, da lief was schief!<br><br>` +
                `Die Datei <strong>Fragen.json</strong> konnte nicht geladen werden.<br>` +
                `<small style="color: #7f8c8d; font-weight: normal;">Hinweis: Überprüfe die Syntax deiner JSON-Datei.</small></div>`;
        }
    }

    function initQuiz() {
        currentQuestionIndex = 0;
        correctAnswersCount = 0;
        answeredQuestionsCount = 0;
        
        // Prüfen, ob der Shuffle-Schalter aktiv ist
        const isShuffleActive = document.getElementById('shuffle-toggle').checked;
        if (isShuffleActive) {
            activeQuestions = shuffleArray([...originalQuestions]);
        } else {
            activeQuestions = [...originalQuestions];
        }

        document.getElementById('quiz-interface').style.display = 'block';
        document.getElementById('result-screen').style.display = 'none';
        
        updateStats();
        showQuestion();
    }

    // Fisher-Yates Shuffle Algorithmus zum echten Durchmischen
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // Falls man mitten im Quiz den Regler umschaltet
    function handleShuffleToggle() {
        const isShuffleActive = document.getElementById('shuffle-toggle').checked;
        
        if (isRevealed) {
            // Wenn die aktuelle Frage schon beantwortet ist, mischen wir den Rest ab der NÄCHSTEN Frage
            let remaining = activeQuestions.slice(currentQuestionIndex + 1);
            if (isShuffleActive) {
                remaining = shuffleArray(remaining);
            } else {
                // Zurück zur originalen Rest-Reihenfolge
                const currentQuestionObj = activeQuestions[currentQuestionIndex];
                const originalIdx = originalQuestions.indexOf(currentQuestionObj);
                remaining = originalQuestions.slice(originalIdx + 1);
            }
            activeQuestions = activeQuestions.slice(0, currentQuestionIndex + 1).concat(remaining);
        } else {
            // Wenn die aktuelle Frage noch offen ist, behalten wir sie bei und mischen den Rest dahinter
            let remaining = activeQuestions.slice(currentQuestionIndex + 1);
            if (isShuffleActive) {
                remaining = shuffleArray(remaining);
            } else {
                const currentQuestionObj = activeQuestions[currentQuestionIndex];
                const originalIdx = originalQuestions.indexOf(currentQuestionObj);
                // Hole alle Fragen aus dem Original, die nicht die aktuelle sind und noch nicht dran waren
                // Da das komplexer ist, bauen wir eine einfache Zuordnung der ungespielten Fragen auf:
                const playedQuestions = activeQuestions.slice(0, currentQuestionIndex + 1);
                remaining = originalQuestions.filter(q => !playedQuestions.includes(q));
            }
            activeQuestions = activeQuestions.slice(0, currentQuestionIndex + 1).concat(remaining);
        }
        updateStats();
    }

    function updateStats() {
        document.getElementById('question-counter').innerText = `Frage: ${currentQuestionIndex + 1} / ${activeQuestions.length}`;
        
        let percentage = answeredQuestionsCount === 0 ? 0 : Math.round((correctAnswersCount / answeredQuestionsCount) * 100);
        document.getElementById('score-percentage').innerText = `Richtig: ${percentage}%`;
        
        let progressWidth = ((currentQuestionIndex) / activeQuestions.length) * 100;
        document.getElementById('progress-bar').style.width = `${progressWidth}%`;
    }

    function showQuestion() {
        const currentQuestion = activeQuestions[currentQuestionIndex];
        document.getElementById('question-text').innerText = currentQuestion.question;
        
        const isMultiple = Array.isArray(currentQuestion.answer) && currentQuestion.answer.length > 1;
        document.getElementById('question-hint').innerText = isMultiple 
            ? "ℹ️ Mehrere Antworten richtig (Mehrfachauswahl)" 
            : "ℹ️ Eine Antwort richtig";

        const choicesContainer = document.getElementById('choices-container');
        choicesContainer.innerHTML = '';
        
        selectedIndices = [];
        isRevealed = false;
        
        document.getElementById('submit-button').style.display = 'block';
        document.getElementById('next-button').style.display = 'none';

        currentQuestion.choices.forEach((choice, index) => {
            const button = document.createElement('button');
            button.classList.add('choice-btn');
            
            const icon = isMultiple ? "☐ " : "○ ";
            button.innerHTML = `<span class="bullet">${icon}</span>${choice}`;
            
            button.onclick = () => toggleSelect(index, button, isMultiple);
            choicesContainer.appendChild(button);
        });
        
        updateStats();
    }

    function toggleSelect(index, button, isMultiple) {
        if (isRevealed) return;

        if (!isMultiple) {
            selectedIndices = [index];
            const buttons = document.getElementById('choices-container').getElementsByClassName('choice-btn');
            for (let btn of buttons) {
                btn.classList.remove('selected');
                btn.querySelector('.bullet').innerText = "○ ";
            }
            button.classList.add('selected');
            button.querySelector('.bullet').innerText = "● ";
        } else {
            if (selectedIndices.includes(index)) {
                selectedIndices = selectedIndices.filter(i => i !== index);
                button.classList.remove('selected');
                button.querySelector('.bullet').innerText = "☐ ";
            } else {
                selectedIndices.push(index);
                button.classList.add('selected');
                button.querySelector('.bullet').innerText = "☑ ";
            }
        }
    }

    function checkAnswers() {
        if (selectedIndices.length === 0) {
            alert("Bitte wähle mindestens eine Antwort aus!");
            return;
        }

        const currentQuestion = activeQuestions[currentQuestionIndex];
        const buttons = document.getElementById('choices-container').getElementsByClassName('choice-btn');
        isRevealed = true;
        answeredQuestionsCount++;

        const correctAnswers = Array.isArray(currentQuestion.answer) 
            ? currentQuestion.answer 
            : [currentQuestion.answer];

        let isPerfect = true;

        currentQuestion.choices.forEach((_, index) => {
            const isCorrectAnswer = correctAnswers.includes(index);
            const isUserSelected = selectedIndices.includes(index);
            const button = buttons[index];

            button.disabled = true;
            button.classList.remove('selected');

            if (isCorrectAnswer) {
                button.classList.add('correct-truth');
                if (!isUserSelected) isPerfect = false;
            } else if (isUserSelected) {
                button.classList.add('wrong-selected');
                isPerfect = false;
            }
        });

        if (isPerfect) {
            correctAnswersCount++;
        }

        let percentage = Math.round((correctAnswersCount / answeredQuestionsCount) * 100);
        document.getElementById('score-percentage').innerText = `Richtig: ${percentage}%`;

        document.getElementById('submit-button').style.display = 'none';
        document.getElementById('next-button').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < activeQuestions.length) {
            showQuestion();
        } else {
            showEndScreen();
        }
    }

    function showEndScreen() {
        document.getElementById('quiz-interface').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        
        document.getElementById('final-score').innerText = `${correctAnswersCount} / ${activeQuestions.length}`;
        let finalPercentage = Math.round((correctAnswersCount / activeQuestions.length) * 100);
        document.getElementById('final-percentage').innerText = `${finalPercentage}% der Fragen richtig beantwortet.`;
    }

    function restartQuiz() {
        initQuiz();
    }

    // Tastensteuerung (Leertaste)
    window.addEventListener('keydown', function(e) {
        if (e.key === ' ' || e.code === 'Space') {
            const submitBtn = document.getElementById('submit-button');
            const nextBtn = document.getElementById('next-button');
            const resultScreen = document.getElementById('result-screen');

            if (submitBtn.style.display === 'block' && selectedIndices.length > 0) {
                e.preventDefault();
                checkAnswers();
            }
            else if (nextBtn.style.display === 'block') {
                e.preventDefault();
                nextQuestion();
            } 
            else if (resultScreen.style.display === 'block') {
                e.preventDefault();
                restartQuiz();
            }
        }
    });

    window.onload = loadQuestions;
</script>

</body>
</html>
